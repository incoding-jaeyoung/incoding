<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지기원</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="flex flex-col items-center justify-center min-h-screen py-2 bg-white">
    <div class="flex flex-col items-center justify-between w-full max-w-4xl p-10 space-y-10 bg-white">
        <div class="flex flex-col items-start space-y-4">
            <div class="flex items-center space-x-2">
                <img src="https://picsum.photos/200" alt="Logo" class="w-12 h-12">
                <h1 class="text-2xl font-bold text-gray-800">지기원, 프리미엄 산양삼의 새로운 기준</h1>
            </div>
            <p class="text-lg text-gray-600">
                지기원은 프리미엄 산양삼 건강식품 브랜드입니다. 잎, 줄기, 뿌리를 포함한 산양삼 전초를 활용하여 산양삼의 뛰어난 효능을 간편하게 담아, 바쁜 일상 속에서도 쉽게 섭취할 수 있도록 만들었습니다. 기력 보충과 건강 증진에 탁월한 효과를 자랑하며, 소중한 분에게 귀한 선물로도 최적의 제품입니다. 지기원과 함께 Well-aging하세요.
            </p>
        </div>
        <button class="flex items-center px-4 py-2 space-x-2 text-white bg-gray-800 rounded">
            <span>지기원 브랜드 사이트</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7" />
            </svg>
        </button>
    </div>
    <div class="flex justify-center w-full mt-10">
        <img src="https://picsum.photos/600/400" alt="Product Image" class="w-full h-auto">
    </div>
</body>
</html>
